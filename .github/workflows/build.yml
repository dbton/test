name: Build cross toolchains

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: '要构建的目标: targets/ 下的目录名, 逗号分隔; 或 all'
        required: false
        default: all
      extra_config:
        description: '追加到 defconfig 末尾的配置行 (覆盖同名项), 例如 CT_ARCH_ARCH="mips32"'
        required: false
        default: ''

env:
  # 1.27.0 自带的 GMP 6.3.0 在 GCC 15+ (默认 -std=gnu23) 下 configure 失败; 1.29.0 内置了修复补丁
  CT_NG_VERSION: 1.29.0
  # 并行 xz 压缩
  XZ_OPT: -9 -T0

permissions:
  contents: read

jobs:
  matrix:
    name: Select targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          TARGETS: ${{ github.event.inputs.targets }}
        run: |
          list="$(scripts/list-targets.sh "${TARGETS}")"
          echo "targets=${list}" >> "$GITHUB_OUTPUT"
          echo "Targets: ${list}"

  build:
    name: ${{ matrix.target }}
    needs: matrix
    runs-on: ubuntu-latest
    # 宿主机要求为 Arch Linux: 在 Arch 容器内构建, 产物链接到 Arch 的 glibc
    container:
      image: archlinux:base-devel
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.targets) }}

    steps:
      - name: Install build dependencies (pacman)
        run: |
          echo "::group::pacman"
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed \
            git wget curl which file unzip rsync \
            help2man texinfo ncurses gperf bison flex \
            libtool autoconf automake python \
            xz bzip2 gzip zstd tar diffutils patch \
            qemu-user-static
          echo "::endgroup::"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache source tarballs
        uses: actions/cache@v4
        with:
          path: tarballs
          key: ct-ng-tarballs-${{ env.CT_NG_VERSION }}-${{ matrix.target }}-${{ hashFiles('common/defconfig', format('targets/{0}/defconfig', matrix.target)) }}
          restore-keys: |
            ct-ng-tarballs-${{ env.CT_NG_VERSION }}-${{ matrix.target }}-
            ct-ng-tarballs-${{ env.CT_NG_VERSION }}-
            ct-ng-tarballs-

      - name: Install crosstool-NG ${{ env.CT_NG_VERSION }}
        run: |
          curl -fsSL -o ct-ng.tar.xz \
            "https://github.com/crosstool-ng/crosstool-ng/releases/download/crosstool-ng-${CT_NG_VERSION}/crosstool-ng-${CT_NG_VERSION}.tar.xz"
          tar xf ct-ng.tar.xz
          cd "crosstool-ng-${CT_NG_VERSION}"
          echo "::group::configure / make / make install"
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          make install
          echo "::endgroup::"
          ct-ng version

      - name: Configure toolchain
        env:
          EXTRA_CONFIG: ${{ github.event.inputs.extra_config }}
        run: |
          printf '%s\n' "${EXTRA_CONFIG}" > extra.defconfig
          scripts/configure.sh "${{ matrix.target }}" extra.defconfig

      - name: Prefetch sources from reliable mirrors
        run: scripts/prefetch.sh

      - name: Build toolchain
        run: ct-ng build."$(nproc)"

      - name: Show build error context
        if: failure()
        run: scripts/error-context.sh

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.target }}
          path: |
            build.log
            .build/**/config.log
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Smoke test
        run: scripts/smoke-test.sh "${CT_TARGET}"

      - name: Package
        run: scripts/package.sh "${{ matrix.target }}" "${CT_TARGET}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: dist/*

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all toolchain artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '*-toolchain-*'
          merge-multiple: true

      - name: Assemble release notes
        run: |
          scripts/release-notes.sh dist > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
          ls -l dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Toolchains ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.xz
            dist/SHA256SUMS
